<svg viewBox="0 0 620 680" fill="none" xmlns="http://www.w3.org/2000/svg" class="revolut-portrait-svg">
  <defs>
    <!-- Skin tones -->
    <linearGradient id="skinBase" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#D49B6A"/>
      <stop offset="50%" stop-color="#BC7F4E"/>
      <stop offset="100%" stop-color="#8E5630"/>
    </linearGradient>
    <linearGradient id="skinHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE0B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE0B8" stop-opacity="0"/>
    </linearGradient>
    <!-- Linen shirt gradients -->
    <linearGradient id="linenBase" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#E3DAC9"/>
      <stop offset="50%" stop-color="#CFC5B2"/>
      <stop offset="100%" stop-color="#AFA38F"/>
    </linearGradient>
    <linearGradient id="linenShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C907E"/>
      <stop offset="100%" stop-color="#7D7260"/>
    </linearGradient>
    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#9E4522"/>
      <stop offset="40%" stop-color="#6E2C11"/>
      <stop offset="80%" stop-color="#3D1606"/>
      <stop offset="100%" stop-color="#220B02"/>
    </linearGradient>
    <!-- Gold earring -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#E5B232"/>
      <stop offset="100%" stop-color="#9E7514"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- BACK HAIR LAYER -->
  <path d="M220 220 C200 130 250 50 330 45 C410 40 460 120 440 230 C460 280 470 360 450 440 C410 450 380 440 370 420 C360 360 380 300 370 250 C360 210 270 220 250 280 C240 330 250 390 240 430 C220 430 200 370 210 300 Z" fill="url(#hairGrad)"/>

  <!-- SHIRT BODY AND SHOULDERS -->
  <g id="shirt">
    <!-- Main torso -->
    <path d="M110 500 C150 430 210 410 260 405 L310 440 L360 405 C410 410 470 430 510 500 L540 680 L80 680 Z" fill="url(#linenBase)"/>
    <!-- Left Shoulder Slope -->
    <path d="M110 500 C150 430 210 410 260 405 L240 450 L140 540 Z" fill="#C5BAA5" opacity="0.6"/>
    <!-- Right Shoulder Slope (Sunlit) -->
    <path d="M510 500 C470 430 410 410 360 405 L380 450 L480 540 Z" fill="#ECE4D6" opacity="0.7"/>

    <!-- Central Placket -->
    <rect x="296" y="435" width="28" height="245" fill="#D9CFBD" stroke="#BAAE9A" stroke-width="1.5"/>
    <g fill="#8C806D">
      <circle cx="310" cy="490" r="4"/>
      <circle cx="310" cy="550" r="4"/>
      <circle cx="310" cy="610" r="4"/>
      <circle cx="310" cy="670" r="4"/>
    </g>

    <!-- Left Flap Pocket -->
    <g id="leftPocket">
      <rect x="165" y="510" width="95" height="105" rx="4" fill="#C5B9A4" stroke="#ABA08D" stroke-width="1.5"/>
      <!-- Pocket Flap -->
      <polygon points="160,510 265,510 265,535 212,548 160,535" fill="#D8CEBD" stroke="#ABA08D" stroke-width="1.5"/>
      <!-- Flap Button -->
      <circle cx="212" cy="535" r="4" fill="#8C806D"/>
      <!-- Stitching line -->
      <line x1="168" y1="518" x2="257" y2="518" stroke="#8C806D" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    </g>

    <!-- Right Flap Pocket -->
    <g id="rightPocket">
      <rect x="360" y="510" width="95" height="105" rx="4" fill="#D3C7B3" stroke="#ABA08D" stroke-width="1.5"/>
      <!-- Pocket Flap -->
      <polygon points="355,510 460,510 460,535 408,548 355,535" fill="#E5DDCF" stroke="#ABA08D" stroke-width="1.5"/>
      <!-- Flap Button -->
      <circle cx="408" cy="535" r="4" fill="#8C806D"/>
      <!-- Stitching line -->
      <line x1="363" y1="518" x2="452" y2="518" stroke="#8C806D" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    </g>

    <!-- Yoke and Seam details -->
    <line x1="140" y1="470" x2="260" y2="450" stroke="#9E927F" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,2"/>
    <line x1="480" y1="470" x2="360" y2="450" stroke="#9E927F" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,2"/>

    <!-- Shirt Collar Lapels (Open) -->
    <!-- Left Collar Lapel -->
    <polygon points="260,405 205,445 285,465 295,435" fill="#DED5C4" stroke="#ABA08D" stroke-width="1.5"/>
    <!-- Right Collar Lapel -->
    <polygon points="360,405 415,445 335,465 325,435" fill="#EBE3D4" stroke="#ABA08D" stroke-width="1.5"/>
  </g>

  <!-- NECK AND CHEST -->
  <g id="neck">
    <path d="M265 320 L260 410 C280 435 340 435 360 410 L355 320 Z" fill="url(#skinBase)"/>
    <!-- Throat Shading -->
    <path d="M280 340 C300 370 320 370 340 340 C330 380 290 380 280 340 Z" fill="#8E5630" opacity="0.4"/>
    <!-- Collarbone hints -->
    <path d="M270 415 Q290 422 310 428" stroke="#8E5630" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M350 415 Q330 422 310 428" stroke="#FFE0B8" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- HEAD AND FACE (ANGLED UPWARD TO SKY) -->
  <g id="head">
    <!-- Chin and Jawline Base -->
    <path d="M235 240 C230 305 270 348 310 348 C350 348 390 305 385 240 C380 180 360 130 310 130 C260 130 240 180 235 240 Z" fill="url(#skinBase)"/>

    <!-- Sunlight on Right Cheek / Jaw -->
    <path d="M310 140 C345 140 375 190 380 240 C385 290 355 335 320 345 C345 325 365 285 360 235 C355 185 335 150 310 140 Z" fill="#FFE0B8" opacity="0.45"/>

    <!-- Left Ear with Gold Hoop Earring -->
    <g id="earring">
      <ellipse cx="236" cy="248" rx="9" ry="16" fill="#BC7F4E"/>
      <!-- Gold Hoop (Exact to Revolut Photo!) -->
      <circle cx="234" cy="265" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
      <circle cx="234" cy="265" r="7" fill="none" stroke="#FFF4BA" stroke-width="1" opacity="0.8"/>
    </g>

    <!-- Jaw Shadow under chin -->
    <path d="M265 325 Q310 355 355 325 Q310 340 265 325 Z" fill="#6E3E1E" opacity="0.5"/>

    <!-- LIPS (CONFIDENT, SLIGHTLY PARTED) -->
    <g id="mouth">
      <!-- Upper lip -->
      <path d="M288 290 Q308 285 328 290 Q308 293 288 290 Z" fill="#9C5238"/>
      <!-- Lower lip with sunlight gleam -->
      <path d="M290 292 Q308 304 326 292 Q308 296 290 292 Z" fill="#B86749"/>
      <ellipse cx="308" cy="296" rx="7" ry="2.5" fill="#E58E70" opacity="0.7"/>
    </g>

    <!-- NOSE (UPWARD PERSPECTIVE) -->
    <g id="nose">
      <!-- Nose bridge -->
      <path d="M304 205 L302 255 L296 265 Q308 270 320 265 L314 255 Z" fill="#A86F44" opacity="0.5"/>
      <!-- Sunlit right side of nose -->
      <path d="M308 210 L311 255 L319 265 Z" fill="#FFE2C2" opacity="0.6"/>
      <!-- Nostril shadows -->
      <ellipse cx="299" cy="264" rx="3.5" ry="2" fill="#5E3214"/>
      <ellipse cx="317" cy="264" rx="3.5" ry="2" fill="#5E3214"/>
      <!-- Nose tip highlight -->
      <circle cx="308" cy="260" r="3.5" fill="#FFE8CE" opacity="0.7"/>
    </g>

    <!-- EYES (LOOKING UPWARD TOWARD SUN) -->
    <g id="eyes">
      <!-- Left Eye -->
      <g>
        <path d="M265 210 Q280 200 295 210 Q280 216 265 210 Z" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="280" cy="208" r="4.5" fill="#3D1E0C"/>
        <circle cx="281" cy="206" r="1.8" fill="#FFFFFF"/>
        <!-- Eyelid / Lash -->
        <path d="M263 209 Q280 198 297 209" stroke="#261005" stroke-width="2.5" fill="none"/>
        <!-- Eyebrow -->
        <path d="M260 195 Q278 185 296 195" stroke="#3D1606" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>
      <!-- Right Eye -->
      <g>
        <path d="M320 210 Q335 200 350 210 Q335 216 320 210 Z" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="335" cy="208" r="4.5" fill="#3D1E0C"/>
        <circle cx="336" cy="206" r="1.8" fill="#FFFFFF"/>
        <!-- Eyelid / Lash -->
        <path d="M318 209 Q335 198 352 209" stroke="#261005" stroke-width="2.5" fill="none"/>
        <!-- Eyebrow -->
        <path d="M318 195 Q336 185 354 195" stroke="#3D1606" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <!-- CHEEKBONE AND TEMPLE SUNLIGHT -->
    <ellipse cx="350" cy="245" rx="20" ry="35" fill="#FFE5C7" opacity="0.25" transform="rotate(15, 350, 245)"/>
  </g>

  <!-- FRONT HAIR STRANDS AND CROWN (WARM AUBURN TONES) -->
  <g id="frontHair">
    <!-- Crown volume -->
    <path d="M230 180 C220 110 260 55 320 50 C380 45 425 100 420 180 C400 120 370 85 320 85 C270 85 240 125 230 180 Z" fill="url(#hairGrad)"/>
    <!-- Left hair fall over shoulder -->
    <path d="M228 170 C220 230 205 310 220 400 C235 440 250 430 240 380 C230 320 235 250 245 190 Z" fill="#5A200B"/>
    <!-- Right hair fall over shoulder (Sunlit) -->
    <path d="M415 170 C430 240 445 320 435 410 C420 440 405 430 415 380 C425 320 420 240 400 180 Z" fill="#843515"/>
    <path d="M425 190 C440 260 450 340 440 420" stroke="#D96E3A" stroke-width="3" fill="none" opacity="0.6" filter="url(#softGlow)"/>
    <!-- Center parting strands -->
    <path d="M315 50 Q318 100 310 135" stroke="#381404" stroke-width="3" fill="none"/>
    <path d="M320 55 Q330 95 338 135" stroke="#A04720" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>

  <!-- WARM SUNBEAM FLARE OVER MODEL (FROM TOP RIGHT) -->
  <circle cx="520" cy="60" r="180" fill="#FFEAA7" opacity="0.15" filter="url(#softGlow)"/>
</svg>